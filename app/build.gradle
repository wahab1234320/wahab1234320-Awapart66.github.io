
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.10.0'
}

android {
    namespace 'id.co.awapart66.app'
    compileSdk 35

    defaultConfig {
        applicationId 'id.co.awapart66.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
